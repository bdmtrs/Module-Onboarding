<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>T-shirt order form<</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!--
          FORM REQUIREMENTS:
          - HTML only (no CSS, no JavaScript)
          - No form action
          - All fields are required
          
          FIELDS:
          1. Name: text (at least 2 characters)
          2. Email: valid email format
          3. T-shirt colour: one of 3 options
          4. T-shirt size: one of 6 options (XS, S, M, L, XL, XXL)
        -->

        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" minlength="2" required />
        </div>

        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <fieldset>
          <legend>T-shirt colour</legend>
          <div>
            <input
              type="radio"
              id="colour-black"
              name="colour"
              value="black"
              required
            />
            <label for="colour-black">Black</label>
          </div>
          <div>
            <input
              type="radio"
              id="colour-white"
              name="colour"
              value="white"
              required
            />
            <label for="colour-white">White</label>
          </div>
          <div>
            <input
              type="radio"
              id="colour-yellow"
              name="colour"
              value="yellow"
              required
            />
            <label for="colour-blue">Yellow</label>
          </div>
        </fieldset>
      </form>
    </main>
    <footer>
      <h2>By Dmitry B.</h2>
    </footer>
  </body>
</html>
