<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>T-shirt order form</title>
    <meta
      name="description"
      content="Order a T-shirt by entering your details and choosing a colour and size"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Your details</legend>
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" minlength="2" required />
          </div>

          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
          </div>
        </fieldset>
        <fieldset>
          <legend>T-shirt details</legend>
          <fieldset>
            <legend>Colour</legend>
            <div>
              <input
                type="radio"
                id="colour-black"
                name="colour"
                value="black"
                required
              />
              <label for="colour-black">Black</label>
            </div>
            <div>
              <input
                type="radio"
                id="colour-white"
                name="colour"
                value="white"
                required
              />
              <label for="colour-white">White</label>
            </div>
            <div>
              <input
                type="radio"
                id="colour-yellow"
                name="colour"
                value="yellow"
                required
              />
              <label for="colour-yellow">Yellow</label>
            </div>
          </fieldset>

          <div>
            <label for="size">Size:</label>
            <select id="size" name="size" required>
              <option value="">Select your size</option>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
              <option value="xxl">XXL</option>
            </select>
          </div>
        </fieldset>

        <button type="submit">Submit order</button>
      </form>
    </main>
    <footer>
      <h2>By Dmitry B.</h2>
    </footer>
  </body>
</html>
